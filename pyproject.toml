[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spoken"
version = "1.1.2"
description = "智能英语口语教练：Windows 桌面程序，选择场景与难度，AI 语音对话并实时纠错"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["english", "speaking", "practice", "llm", "gui", "speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
# 语音能力（可选）：不装也能以纯文字模式运行
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "pyttsx3>=2.90",
]
# 打包成独立 exe（开发者本机执行，产物不进仓库）
packaging = [
    "pyinstaller>=6.0",
]

[project.scripts]
spoken = "spoken.gui:main"

[tool.setuptools]
packages = ["spoken"]
