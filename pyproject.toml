[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spoken"
version = "0.1.0"
description = "智能英语口语对话练习程序：选择场景与难度，AI 扮演角色陪练并实时纠错（命令行）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["english", "speaking", "practice", "llm", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.scripts]
spoken = "spoken.cli:main"

[tool.setuptools]
packages = ["spoken"]
