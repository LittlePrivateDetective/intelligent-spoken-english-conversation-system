name: build-windows-app

# 推 v2 的 tag（如 v2.0.0）时自动构建 Windows 应用并发布到 Release；
# 也可以在 Actions 页面手动触发，产物作为 Artifact 下载。
# 只认 v2.* 开头的 tag，避免和桌面版 v1 的发版流程互相触发。
on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2-web

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: v2-web/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包（PyInstaller，onedir）
        run: python -m PyInstaller spoken_web.spec --noconfirm --clean

      - name: 体积与内容自检
        shell: pwsh
        working-directory: .
        run: |
          $root = "v2-web/dist/spoken-web"
          $size = (Get-ChildItem -Recurse $root | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "产物大小：$([math]::Round($size,1)) MB"

          # 低于 80MB 说明语音识别依赖（ctranslate2 的 DLL）没打进去
          if ($size -lt 80) {
            Write-Error "产物只有 $([math]::Round($size,1)) MB，疑似依赖缺失"
            exit 1
          }
          if (-not (Test-Path "$root/_internal/web/index.html")) {
            Write-Error "前端文件没打进去"
            exit 1
          }
          if (-not (Test-Path "$root/_internal/papers/cet4.json")) {
            Write-Error "题库没打进去"
            exit 1
          }
          # 绝不能把开发者的真实配置带进发行包
          if (Test-Path "$root/_internal/config.yaml") {
            Write-Error "检测到 config.yaml 被打包，可能泄露 API Key"
            exit 1
          }
          Write-Host "自检通过"

      - name: 压缩成 zip
        shell: pwsh
        working-directory: .
        run: |
          Compress-Archive -Path v2-web/dist/spoken-web -DestinationPath spoken-web-windows.zip -Force
          Get-Item spoken-web-windows.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: spoken-web-windows
          path: spoken-web-windows.zip
          retention-days: 14

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: spoken-web-windows.zip
          # 注意：不要再加 generate_release_notes，它会把这里的 body 覆盖成空
          body: |
            ## 下载与使用

            1. 下载下面的 `spoken-web-windows.zip`，解压到一个**可写目录**
               （桌面或文档都行，不要放 `C:\Program Files`）。
            2. 双击 `spoken-web.exe`，浏览器会自动打开页面。
            3. 首次运行会在 `%APPDATA%\spoken-web\config.yaml` 生成配置文件，
               把 `llm.api_key` 换成你自己的 Key（通义 / DeepSeek 都可以），
               重启程序即可。

            不填 Key 也能打开页面，但对话与评分会走离线演示模式。

            **关于语音**：第一次用麦克风时会下载识别模型（默认 base，约 150 MB），
            期间页面顶部显示「语音模型加载中」，这段时间可以先用打字练习。
            模型下完后每次启动都在几秒内就绪。
